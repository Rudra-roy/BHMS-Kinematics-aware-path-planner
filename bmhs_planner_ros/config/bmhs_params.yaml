# ─── BMHS Planner Parameters ──────────────────────────────────────────────────
# All parameters can be overridden via launch arguments or this file.

bmhs_planner_node:
  ros__parameters:
    # Map
    map_path: ""                    # Set via launch arg or override here
    map_resolution: 0.05            # metres/pixel
    map_origin_x: 0.0              # metres
    map_origin_y: 0.0              # metres
    frame_id: "map"

    # Vehicle (Clearpath Husky A200 defaults)
    vehicle_type: "differential"   # "differential" or "ackermann"
    vehicle_width: 0.67            # metres
    vehicle_length: 0.99           # metres
    inflation_radius: 0.3          # metres

    # Topics (Husky namespace)
    odom_topic: "/a200_0000/odom"

path_follower_node:
  ros__parameters:
    # Pure-pursuit controller
    lookahead_distance: 0.8        # metres
    max_linear_vel: 0.5            # m/s
    max_angular_vel: 1.0           # rad/s
    goal_tolerance: 0.3            # metres
    control_rate: 20.0             # Hz

    # Topics (Husky namespace)
    odom_topic: "/a200_0000/odom"
    cmd_vel_topic: "/a200_0000/cmd_vel"

bmhs_navigator_node:
  ros__parameters:
    goal_topic: "/goal_pose"       # rviz2 "2D Goal Pose" topic
